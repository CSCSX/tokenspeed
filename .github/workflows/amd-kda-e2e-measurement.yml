name: AMD KDA E2E Measurement
on:
  push:
    branches: [kda-recoverssm-amd-e2e]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: amd-kda-e2e-${{ github.ref }}
  cancel-in-progress: false
jobs:
  e2e:
    if: github.ref_name == 'kda-recoverssm-amd-e2e'
    uses: ./.github/workflows/run-ci-task-matrix.yml
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    with:
      matrix: >-
        {"include":[{"name":"perf-kda-replay-e2e-amd-gfx950-t1","type":"perf","config":"test/ci/perf/kda-replay-e2e-amd-gfx950-t1.yaml","runner":"amd-mi350-8gpu-bench","priority":"normal","optional":false,"workflow_stage":"model-test"},{"name":"perf-kda-replay-e2e-amd-gfx950-eagle3","type":"perf","config":"test/ci/perf/kda-replay-e2e-amd-gfx950-eagle3.yaml","runner":"amd-mi350-8gpu-bench","priority":"normal","optional":false,"workflow_stage":"model-test"}]}
      install_tokenspeed_mla_from_source: ${{ 'false' }}
      checkout_ref: ${{ github.sha }}
      timeout_minutes: 360
