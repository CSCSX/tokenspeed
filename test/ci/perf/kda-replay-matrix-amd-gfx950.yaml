    """Collect a diagnostic recovery counter sample after all timing matrices."""

    import argparse
    import csv
    import hashlib
    import json
    import math
    import os
    import re
    import signal
    import subprocess
    import sys
    import textwrap
    from collections import Counter, deque
    from pathlib import Path


    VERIFY = "gluon_kda_fused_paged_verify_nostore_vmajor_gfx950"
    RECOVERY = "gluon_kda_fused_replay_gfx950"
    CONFIGURATION_ERROR_PATTERN = (
        r"ROCPROFILER_STATUS_ERROR_CONFIGURATION_LOCKED|error code 16\b.*configuration"
    )


    def failure_evidence(output: str) -> dict:
        """Describe configuration paths visible in the complete raw failure log."""
        return {
            "configuration_locked": bool(re.search(CONFIGURATION_ERROR_PATTERN, output, re.IGNORECASE)),
            "force_configure_present": "rocprofiler_force_configure" in output,
            "proton_constructor_present": "proton::RocprofSDKProfiler" in output,
        }


    def run_command(arguments: list[str], log: Path, timeout: float) -> dict:
        result = {"arguments": arguments, "returncode": None, "timed_out": False, "error": None}
        with log.open("w") as output:
            try:
                process = subprocess.Popen(
                    arguments, stdout=output, stderr=subprocess.STDOUT, start_new_session=True
                )
                try:
                    result["returncode"] = process.wait(timeout=timeout)
                except subprocess.TimeoutExpired:
                    result["timed_out"] = True
                    try:
                        os.killpg(process.pid, signal.SIGTERM)
                    except ProcessLookupError:
                        pass
                    try:
                        process.wait(timeout=5)
                    except subprocess.TimeoutExpired:
                        pass
                    # The profiler can exit before its application child exits.
                    try:
                        os.killpg(process.pid, signal.SIGKILL)
                    except ProcessLookupError:
                        pass
                    result["returncode"] = process.wait(timeout=5)
            except OSError as error:
                result["error"] = str(error)
        return result


    def summarize_csv(path: Path) -> dict:
        counts = Counter()
        verify_first = []
        verify_last = deque(maxlen=4)
        recovery = []
        counters = []
        graph_launches = []
        samples = []
        counter_count = recovery_count = graph_count = total = 0
        with path.open(newline="") as stream:
            reader = csv.DictReader(stream)
            fields = reader.fieldnames or []
            for row in reader:
                total += 1
                if len(samples) < 2:
                    samples.append(row)
                name = row.get("Kernel_Name")
                if name is not None:
                    counts[(row.get("Kernel_Id"), name)] += 1
                if "Counter_Name" in fields:
                    counter_count += 1
                    if len(counters) < 256:
                        counters.append(row)
                elif name is not None:
                    if name.startswith(VERIFY):
                        if len(verify_first) < 4:
                            verify_first.append(row)
                        verify_last.append(row)
                    elif name.startswith(RECOVERY):
                        recovery_count += 1
                        if len(recovery) < 32:
                            recovery.append(row)
                if any(value and value.startswith("hipGraphLaunch") for value in row.values() if isinstance(value, str)):
                    graph_count += 1
                    if len(graph_launches) < 32:
                        graph_launches.append(row)
        return {
            "file": path.name, "fields": fields, "row_count": total,
            "sample_rows": samples,
            "kernel_name_and_id_row_counts": [
                {"kernel_id": key[0], "kernel_name": key[1], "row_count": count}
                for key, count in counts.items()
            ],
            "kernel_id_column_present": "Kernel_Id" in fields,
            "dispatch_id_column_present": "Dispatch_Id" in fields,
            "verify_first_rows": verify_first, "verify_last_rows": list(verify_last),
            "recovery_count": recovery_count, "recovery_rows": recovery,
            "recovery_truncated": recovery_count > len(recovery),
            "counter_row_count": counter_count, "counter_rows": counters,
            "counter_rows_truncated": counter_count > len(counters),
            "graph_launch_count": graph_count, "graph_launch_rows": graph_launches,
            "graph_launches_truncated": graph_count > len(graph_launches),
            "scope": "Raw CSV fields only; no dimension aggregation or dispatch-attribution claim",
        }


    def summarize_probe_trace(output_dir: Path) -> dict:
        """Require actual kernel dispatch records before trying the larger workload."""
        valid = []
        invalid_count = 0
        valid_count = 0
        files = []
        for path in sorted(output_dir.rglob("*kernel_trace.csv")):
            files.append(str(path.relative_to(output_dir)))
            with path.open(newline="") as stream:
                for row in csv.DictReader(stream):
                    try:
                        valid_row = (
                            bool((row["Kernel_Name"] or "").strip())
                            and int(row["Dispatch_Id"]) >= 0
                            and 0 < int(row["Start_Timestamp"]) < int(row["End_Timestamp"])
                        )
                    except (KeyError, TypeError, ValueError):
                        valid_row = False
                    if valid_row:
                        valid_count += 1
                        if len(valid) < 8:
                            valid.append(row)
                    else:
                        invalid_count += 1
        return {
            "files": files, "valid_count": valid_count, "invalid_count": invalid_count,
            "rows": valid, "rows_truncated": valid_count > len(valid),
        }


    def collect_initialization(
        arguments: list[str], output_dir: Path, help_text: str, guard: Path | None
    ) -> dict:
        """Inspect profiler loading around a minimal Torch import and GPU operation."""
        output_dir.mkdir(parents=True, exist_ok=True)
        workload = output_dir / "torch-import.py"
        workload.write_text(textwrap.dedent("""
            import ctypes
            import json
            import os
            from pathlib import Path

            def snapshot(stage):
                libraries = set()
                for line in Path("/proc/self/maps").read_text().splitlines():
                    fields = line.split(maxsplit=5)
                    if len(fields) == 6 and any(
                        name in Path(fields[5]).name
                        for name in ("rocprofiler", "roctracer", "amdhip64")
                    ):
                        libraries.add(str(Path(fields[5]).resolve()))
                state = ctypes.c_int(-1)
                try:
                    query = ctypes.CDLL(None).rocprofiler_is_initialized
                    query.argtypes = [ctypes.POINTER(ctypes.c_int)]
                    query.restype = ctypes.c_int
                    sdk = {"returncode": query(ctypes.byref(state)), "initialized": state.value}
                except (AttributeError, OSError) as error:
                    sdk = {"unavailable": str(error)}
                print("ROCPROF_IMPORT_STAGE=" + json.dumps({
                    "stage": stage, "pid": os.getpid(), "libraries": sorted(libraries),
                    "global_sdk": sdk,
                    "constructor_flag": os.environ.get("ROCPROFILER_LIBRARY_CTOR"),
                }), flush=True)

            snapshot("before_torch")
            import torch
            snapshot("after_torch")
            values = torch.arange(8, dtype=torch.float32, device="cuda")
            result = (values * 2 + 1).sum().item()
            torch.cuda.synchronize()
            if result != 64:
                raise RuntimeError(f"Torch GPU arithmetic returned {result}, expected 64")
            snapshot("gpu_complete")
        """).lstrip())
        profiler_arguments = arguments[:arguments.index("--")]
        profiler_arguments[profiler_arguments.index("-d") + 1] = str(output_dir)
        profiler_arguments[profiler_arguments.index("-o") + 1] = "torch-import"
        profiler_arguments[profiler_arguments.index("--kernel-include-regex") + 1] = ".*"
        profiler_arguments[profiler_arguments.index("--kernel-iteration-range") + 1] = "1"
        if re.search(r"--log-level[^\n]*\binfo\b", help_text):
            profiler_arguments.extend(["--log-level", "info"])
        profiler_arguments.extend(["--", sys.executable])
        if guard is not None:
            profiler_arguments.append(str(guard))
        profiler_arguments.append(str(workload))
        # Loader logging is scoped to this optional child after all timings.
        command = [
            "/usr/bin/env", "LD_DEBUG=libs",
            f"LD_DEBUG_OUTPUT={output_dir.resolve() / 'loader'}",
            *profiler_arguments,
        ]
        log = output_dir / "profiler.txt"
        outcome = run_command(command, log, 120)
        output = log.read_text(errors="replace")
        stages = [
            json.loads(line.split("=", 1)[1])
            for line in output.splitlines() if line.startswith("ROCPROF_IMPORT_STAGE=")
        ]
        initializers = []
        initializer_count = 0
        loader_files = []
        for path in sorted(output_dir.glob("loader.*")):
            loader_files.append({"file": path.name, "bytes": path.stat().st_size})
            for line in path.read_text(errors="replace").splitlines():
                if "calling init:" in line and any(
                    name in line for name in ("rocprofiler", "roctracer", "amdhip64")
                ):
                    initializer_count += 1
                    if len(initializers) < 64:
                        library = Path(line.split("calling init:", 1)[1].strip())
                        initializers.append({
                            "file": path.name, "line": line.strip(),
                            "library": str(library),
                            "resolved_path": str(library.resolve()),
                            "exists": library.is_file(),
                        })
        lines = output.splitlines()
        configuration_errors = [
            "\n".join(lines[max(0, index - 3):index + 4])
            for index, line in enumerate(lines)
            if re.search(
                CONFIGURATION_ERROR_PATTERN, line, re.IGNORECASE,
            )
        ]
        complete = any(stage["stage"] == "gpu_complete" for stage in stages)
        return {
            "status": "gpu_complete" if outcome["returncode"] == 0 and not outcome["timed_out"] and complete else "incomplete",
            "command": outcome, "stages": stages,
            "loader_files": loader_files, "library_initializers": initializers,
            "initializer_count": initializer_count,
            "initializers_truncated": initializer_count > len(initializers),
            "failure_evidence": failure_evidence(output),
            "configuration_error_pattern": CONFIGURATION_ERROR_PATTERN,
            "configuration_error_count": len(configuration_errors),
            "configuration_error_contexts": configuration_errors[:4],
            "configuration_errors_truncated": len(configuration_errors) > 4,
            "trace": summarize_probe_trace(output_dir),
            "guard_stages": [
                json.loads(line.split("=", 1)[1])
                for line in lines if line.startswith("ROCPROF_GUARD_STAGE=")
            ],
            "log": {
                "file": log.name, "chars": len(output), "head": output[:3000],
                "tail": output[-3000:] if len(output) > 3000 else "",
                "truncated": len(output) > 6000,
            },
            "scope": (
                "Initialization evidence only; calling init records entry, not completion. "
                "Search attempts are excluded. Baseline and guarded probes use the same "
                "tiny-kernel profiler flags. No installed libraries or timed workloads change."
            ),
        }



    def sdk_guard_gate(diagnostic: dict) -> dict:
        """Admit only the observed duplicate-SDK constructor failure in this job."""
        reasons = []
        command = diagnostic.get("command", {})
        if command.get("returncode") in (None, 0) or command.get("timed_out") or command.get("error"):
            reasons.append("baseline_probe_did_not_fail_cleanly")
        if not diagnostic.get("configuration_error_count"):
            reasons.append("exact_configuration_error_not_found")
        stages = diagnostic.get("stages", [])
        before = [stage for stage in stages if stage["stage"] == "before_torch"]
        system_paths = set()
        torch_paths = set()
        if len(before) != 1 or len(stages) != 1:
            reasons.append("failure_not_isolated_to_torch_import")
        else:
            stage = before[0]
            if stage["global_sdk"] != {"returncode": 0, "initialized": 1}:
                reasons.append("global_sdk_not_initialized")
            if stage["constructor_flag"] != "1":
                reasons.append("constructor_policy_not_enabled")
            for entry in diagnostic.get("library_initializers", []):
                path = entry["resolved_path"]
                if not entry.get("exists") or entry["file"] != f"loader.{stage['pid']}" or not re.fullmatch(
                    r"librocprofiler-sdk\.so(?:\.\d+)*", Path(path).name
                ):
                    continue
                if path in stage["libraries"] and path.startswith("/opt/rocm"):
                    system_paths.add(path)
                if "/site-packages/torch/lib/" in path:
                    torch_paths.add(path)
            if not system_paths or not torch_paths or system_paths & torch_paths:
                reasons.append("distinct_system_and_torch_sdk_initializers_not_proven")
        if diagnostic.get("initializers_truncated"):
            reasons.append("initializer_evidence_truncated")
        return {
            "eligible": not reasons, "reasons": reasons,
            "system_sdk_paths": sorted(system_paths), "torch_sdk_paths": sorted(torch_paths),
        }


    def write_sdk_guard(path: Path) -> None:
        """Create a child-only experiment for the upstream duplicate-SDK failure."""
        path.write_text(textwrap.dedent("""
            import ctypes
            import json
            import os
            import runpy
            import sys
            from pathlib import Path

            def snapshot(stage):
                process = ctypes.CDLL(None)
                query = process.rocprofiler_is_initialized
                query.argtypes = [ctypes.POINTER(ctypes.c_int)]
                query.restype = ctypes.c_int
                getenv = process.getenv
                getenv.argtypes = [ctypes.c_char_p]
                getenv.restype = ctypes.c_char_p
                state = ctypes.c_int(-1)
                status = query(ctypes.byref(state))
                policy = getenv(b"ROCPROFILER_LIBRARY_CTOR")
                proton_disable = getenv(b"TRITON_PROTON_DISABLE")
                libraries = set()
                for line in Path("/proc/self/maps").read_text().splitlines():
                    fields = line.split(maxsplit=5)
                    if len(fields) == 6 and Path(fields[5]).name.startswith("libproton"):
                        libraries.add(str(Path(fields[5]).resolve()))
                boundary = sys.modules.get("tokenspeed_kernel._triton")
                result = {
                    "stage": stage, "returncode": status, "initialized": state.value,
                    "constructor_flag": None if policy is None else policy.decode(),
                    "proton_disable_flag": None if proton_disable is None else proton_disable.decode(),
                    "proton_native_libraries": sorted(libraries),
                    "tokenspeed_boundary_loaded": boundary is not None,
                    "proton_disabled_at_boundary": None if boundary is None else boundary.proton is None,
                }
                print("ROCPROF_GUARD_STAGE=" + json.dumps(result), flush=True)
                return result

            before = snapshot("before_guard")
            if before["returncode"] != 0 or before["initialized"] != 1 or before["constructor_flag"] != "1":
                raise RuntimeError("Profiler constructor guard preconditions were not met")
            # The first SDK remains initialized. Suppress only later constructors.
            os.environ["ROCPROFILER_LIBRARY_CTOR"] = "0"
            # This workload uses rocprofv3; Proton must not configure another tool.
            os.environ["TRITON_PROTON_DISABLE"] = "1"
            after = snapshot("after_guard")
            if (
                after["returncode"] != 0
                or after["initialized"] != 1
                or after["constructor_flag"] != "0"
            ):
                raise RuntimeError("Profiler constructor guard did not preserve the active SDK")
            if after["proton_disable_flag"] != "1":
                raise RuntimeError("Proton disable setting was not applied")
            sys.argv = sys.argv[1:]
            sys.path[0] = str(Path(sys.argv[0]).resolve().parent)
            try:
                runpy.run_path(sys.argv[0], run_name="__main__")
            finally:
                snapshot("after_workload")
        """).lstrip())


    def collect_profile(arguments: list[str], output_dir: Path) -> dict:
        log = output_dir / "profiler.txt"
        command = run_command(arguments, log, 600)
        output = log.read_text(errors="replace")
        report = {
            "command": command,
            "failure_evidence": failure_evidence(output),
            "status": "collected_requires_review" if command["returncode"] == 0 and not command["timed_out"] else "profiler_failed",
            "log": {
                "file": log.name, "chars": len(output), "head": output[:4000],
                "tail": output[-4000:] if len(output) > 4000 else "",
                "truncated": len(output) > 8000,
            },
            "workload_metadata": [
                json.loads(line.split("=", 1)[1])
                for line in output.splitlines() if line.startswith("KDA_PROFILE_WORKLOAD=")
            ],
            "guard_stages": [
                json.loads(line.split("=", 1)[1])
                for line in output.splitlines() if line.startswith("ROCPROF_GUARD_STAGE=")
            ],
            "csv": [], "reasons": [],
            "attribution": "unvalidated: inspect graph API, dispatch IDs, kernel IDs and counter rows",
        }
        for path in sorted(output_dir.rglob("*.csv")):
            try:
                report["csv"].append(summarize_csv(path))
            except (OSError, csv.Error, UnicodeError) as error:
                report["csv"].append({"file": str(path.relative_to(output_dir)), "error": str(error)})
        if not report["csv"]:
            report["reasons"].append("no_CSV_output")
        return report


    def counter_definitions(counter_text: str, names: tuple[str, ...]) -> dict:
        """Keep exact inventory entries, including SDK block and dimension fields."""
        matches = list(re.finditer(r"^Counter_Name[ \t]*:[ \t]*(\S+)[ \t]*$", counter_text, re.MULTILINE))
        definitions = {name: [] for name in names}
        for index, match in enumerate(matches):
            name = match.group(1)
            if name in definitions:
                end = matches[index + 1].start() if index + 1 < len(matches) else len(counter_text)
                definitions[name].append(counter_text[match.start():end])
        return definitions


    def selected_recovery_sample(profile: dict, counter_names: tuple[str, ...]) -> dict:
        """Join one counter sample to its own final recovery dispatch and graph."""
        report = {"status": "unattributed", "reasons": [], "counter_rows": []}
        try:
            if profile["status"] != "collected_requires_review" or profile["reasons"]:
                raise ValueError("profile did not complete with CSV output")
            if any(profile["failure_evidence"].values()):
                raise ValueError("profiler initialization failure evidence")
            snapshots = [row for row in profile["guard_stages"] if row["stage"] == "after_workload"]
            if len(snapshots) != 1:
                raise ValueError("missing unique final SDK guard snapshot")
            snapshot = snapshots[0]
            if (
                snapshot["returncode"] != 0 or snapshot["initialized"] != 1
                or snapshot["constructor_flag"] != "0" or snapshot["proton_disable_flag"] != "1"
                or snapshot["proton_native_libraries"] or not snapshot["tokenspeed_boundary_loaded"]
                or not snapshot["proton_disabled_at_boundary"]
            ):
                raise ValueError("final SDK/Proton guard state differs from the requested state")
            metadata = profile["workload_metadata"]
            if len(metadata) != 1 or not metadata[0]["source_sha256"]:
                raise ValueError("missing unique workload metadata/source hash")
            metadata = metadata[0]
            recovery, graphs, counters = [], [], []
            verify_count = 0
            for table in profile["csv"]:
                if table.get("error") or any(table[key] for key in ("recovery_truncated", "counter_rows_truncated", "graph_launches_truncated")):
                    raise ValueError("incomplete CSV evidence")
                recovery.extend(table["recovery_rows"])
                graphs.extend(table["graph_launch_rows"])
                counters.extend(table["counter_rows"])
                verify_count += sum(
                    row["row_count"] for row in table["kernel_name_and_id_row_counts"]
                    if row["kernel_name"].startswith(VERIFY)
                )
            report["counter_rows"] = counters
            expected = metadata["trace_hypothesis"]
            if (
                len(recovery) != expected["recovery_count"]
                or len(recovery) != expected["measured_recovery"]
                or verify_count != expected["verify_count"]
                or len(graphs) != 1 + metadata["replay_warmups"] + metadata["measured_replays"]
                or metadata["measured_replays"] != 1
            ):
                raise ValueError("workload dispatch/graph counts differ from the recorded hypothesis")
            if not recovery or len({row["Dispatch_Id"] for row in recovery}) != len(recovery):
                raise ValueError("missing or duplicate recovery dispatches")
            # CSV file order is not an execution-order guarantee.
            recovery.sort(key=lambda row: (int(row["Start_Timestamp"]), int(row["Dispatch_Id"])))
            graphs.sort(key=lambda row: int(row["Start_Timestamp"]))
            if len({(row["Process_Id"], row["Correlation_Id"]) for row in graphs}) != len(graphs):
                raise ValueError("duplicate graph correlations within one process")
            for dispatch, graph in zip(recovery[-len(graphs):], graphs, strict=True):
                if dispatch["Correlation_Id"] != graph["Correlation_Id"] or dispatch["Thread_Id"] != graph["Thread_Id"]:
                    raise ValueError("recovery/graph correlation or thread mismatch")
            selected = recovery[-1]
            if selected["Kernel_Name"] != RECOVERY or int(selected["End_Timestamp"]) <= int(selected["Start_Timestamp"]):
                raise ValueError("invalid selected recovery name or timestamps")
            if len(counters) != len(counter_names) or {row["Counter_Name"] for row in counters} != set(counter_names):
                raise ValueError("counter names/cardinality differ from the requested group")
            grid = [int(selected[f"Grid_Size_{axis}"]) for axis in "XYZ"]
            workgroup = [int(selected[f"Workgroup_Size_{axis}"]) for axis in "XYZ"]
            links = ("Dispatch_Id", "Kernel_Id", "Kernel_Name", "Correlation_Id", "Agent_Id", "Queue_Id", "Thread_Id", "Start_Timestamp", "End_Timestamp")
            for row in counters:
                if not row["Process_Id"] or row["Process_Id"] != graphs[-1]["Process_Id"]:
                    raise ValueError("counter/graph process mismatch")
                if any(not row[field] or row[field] != selected[field] for field in links):
                    raise ValueError("counter row does not identify the selected recovery dispatch")
                if int(row["Grid_Size"]) != math.prod(grid) or int(row["Workgroup_Size"]) != math.prod(workgroup):
                    raise ValueError("counter/dispatch geometry mismatch")
                value = float(row["Counter_Value"])
                if not math.isfinite(value) or value < 0:
                    raise ValueError("counter value is not finite and nonnegative")
            waves = float(next(row["Counter_Value"] for row in counters if row["Counter_Name"] == "SQ_WAVES"))
            if waves <= 0 or any(size <= 0 for size in grid + workgroup):
                raise ValueError("empty wave count or dispatch geometry")
            report.update(
                status="selected", workload_metadata=metadata, dispatch=selected,
                graph=graphs[-1], grid=grid, workgroup=workgroup, waves=waves,
            )
        except (KeyError, TypeError, ValueError, IndexError, StopIteration) as error:
            report["reasons"].append(f"{type(error).__name__}: {error}")
        return report


    def collect_memory_requests(arguments: list[str], output_dir: Path, counter_text: str, basic_profile: dict) -> dict:
        """Collect independent raw request groups without converting them to bytes."""
        report = {
            "status": "skipped", "groups": {},
            "scope": (
                "Raw TCC/EA request counts for one selected recovery dispatch under profiling, "
                "aggregated by the SDK CSV writer across instances; not a direct DRAM-byte "
                "measurement, with no per-XCD distribution recoverable. No byte conversion, "
                "bandwidth, scale, stall, occupancy or performance-acceptance claim."
            ),
            "basic_sample": selected_recovery_sample(basic_profile, ("SQ_WAVES",)),
        }
        basic = report["basic_sample"]
        if basic["status"] != "selected":
            report["reason"] = "basic_profile_unattributed"
            return report
        groups = (
            ("reads", ("SQ_WAVES", "TCC_EA0_RDREQ_128B", "TCC_EA0_RDREQ_64B", "TCC_EA0_RDREQ_32B")),
            ("writes", ("SQ_WAVES", "TCC_EA0_WRREQ", "TCC_EA0_WRREQ_64B")),
        )
        report["status"] = "attempted"
        for name, names in groups:
            definitions = counter_definitions(counter_text, names)
            missing = [counter for counter, entries in definitions.items() if not entries]
            group = {"status": "unavailable", "requested_counters": list(names), "definitions": definitions, "missing_names": missing}
            report["groups"][name] = group
            if missing:
                continue
            try:
                directory = output_dir / name
                directory.mkdir(parents=True, exist_ok=True)
                command = list(arguments)
                begin = command.index("--pmc") + 1
                end = command.index("--kernel-include-regex", begin)
                command[begin:end] = names
                command[command.index("-d") + 1] = str(directory)
                group["profile"] = collect_profile(command, directory)
                sample = selected_recovery_sample(group["profile"], names)
                group["sample"] = sample
                if sample["status"] != "selected":
                    group["status"] = "profiler_failed" if group["profile"]["status"] == "profiler_failed" else "unattributed"
                    continue
                # IDs belong to each process. Compare work and geometry across passes.
                differences = [key for key in ("workload_metadata", "grid", "workgroup", "waves") if sample[key] != basic[key]]
                group["consistency"] = {"matches_basic_profile": not differences, "differences": differences}
                group["status"] = "unattributed" if differences else "collected_requires_review"
            except Exception as error:
                group["status"] = "error"
                group["error"] = f"{type(error).__name__}: {error}"
        return report


    def collect_guarded_smoke(
        diagnostic: dict, arguments: list[str], output_dir: Path, help_text: str, counter_text: str
    ) -> dict:
        gate = sdk_guard_gate(diagnostic)
        report = {
            "status": "skipped", "gate": gate,
            "scope": "Final process-map snapshots require Python cleanup; native aborts can skip them.",
        }
        if not gate["eligible"]:
            return report
        output_dir.mkdir(parents=True, exist_ok=True)
        guard = output_dir / "sdk-constructor-guard.py"
        write_sdk_guard(guard)
        probe = collect_initialization(arguments, output_dir / "torch-import", help_text, guard)
        report["initialization_diagnostic"] = probe
        trace = probe["trace"]
        if probe["status"] != "gpu_complete" or not trace["valid_count"] or trace["invalid_count"]:
            report["status"] = "guarded_probe_incomplete"
            return report
        # Keep the original KDA flags and workload arguments after the tiny probe passes.
        recovery_dir = output_dir / "recovery"
        recovery_dir.mkdir(parents=True, exist_ok=True)
        guarded_arguments = list(arguments)
        guarded_arguments[guarded_arguments.index("-d") + 1] = str(recovery_dir)
        guarded_arguments.insert(guarded_arguments.index("--") + 2, str(guard))
        report["recovery"] = collect_profile(guarded_arguments, recovery_dir)
        report["status"] = report["recovery"]["status"]
        try:
            report["memory_requests"] = collect_memory_requests(
                guarded_arguments, output_dir / "memory-requests", counter_text, report["recovery"]
            )
        except Exception as error:
            # Optional counters must preserve the completed basic profile.
            report["memory_requests"] = {"status": "error", "error": f"{type(error).__name__}: {error}"}
        return report


    def collect_smoke(inventory_dir: Path, output_dir: Path, workload: Path) -> dict:
        output_dir.mkdir(parents=True, exist_ok=True)
        report = {
            "status": "skipped", "reasons": [], "command": None, "csv": [],
            "scope": "Diagnostic only; instrumented timing never determines performance acceptance",
            "attribution": "unvalidated: inspect graph API, dispatch IDs, kernel IDs and counter rows",
            "workload_sha256": hashlib.sha256(workload.read_bytes()).hexdigest(),
        }
        inventory = json.loads((inventory_dir / "inventory.json").read_text())
        report["inventory"] = {
            key: inventory.get(key)
            for key in ("status", "executable", "gpu_architecture", "torch_version", "hip_version")
        }
        report["profiler_version"] = (inventory_dir / "version.txt").read_text(errors="replace") if (inventory_dir / "version.txt").exists() else None
        flags = ("--kernel-trace", "--hip-runtime-trace", "--pmc", "--kernel-include-regex", "--kernel-iteration-range", "--output-directory", "--output-file", "--output-format")
        help_path = inventory_dir / "help.txt"
        help_text = help_path.read_text(errors="replace") if help_path.exists() else ""
        list_path = inventory_dir / "list-avail.txt"
        counter_text = list_path.read_text(errors="replace") if list_path.exists() else ""
        if inventory.get("status") != "inventory_complete":
            report["reasons"].append("inventory_incomplete_or_unavailable")
        for flag in flags:
            if flag not in help_text:
                report["reasons"].append(f"missing_help_flag:{flag}")
        if re.search(r"^Counter_Name\s*:\s*SQ_WAVES\s*$", counter_text, re.MULTILINE) is None:
            report["reasons"].append("SQ_WAVES_definition_not_found")
        executable = inventory.get("executable")
        if executable is None or not Path(executable).is_file() or not os.access(executable, os.X_OK):
            report["reasons"].append("profiler_executable_unavailable")
        if not report["reasons"]:
            arguments = [
                executable, "--kernel-trace", "--hip-runtime-trace", "--pmc", "SQ_WAVES",
                "--kernel-include-regex", f"^{RECOVERY}", "--kernel-iteration-range", "10",
                "-d", str(output_dir), "-o", "recovery", "-f", "csv", "--",
                sys.executable, str(workload), "--batch", "128", "--page-relation", "distinct",
            ]
            report.update(collect_profile(arguments, output_dir))
            try:
                report["initialization_diagnostic"] = collect_initialization(
                    arguments, output_dir / "torch-import", help_text, None
                )
            except Exception as error:
                report["initialization_diagnostic"] = {
                    "status": "error", "error": f"{type(error).__name__}: {error}"
                }
            try:
                report["guarded_sdk_experiment"] = collect_guarded_smoke(
                    report["initialization_diagnostic"], arguments, output_dir / "guarded-sdk", help_text, counter_text
                )
            except Exception as error:
                report["guarded_sdk_experiment"] = {
                    "status": "error", "error": f"{type(error).__name__}: {error}"
                }
        report["files"] = [str(p.relative_to(output_dir)) for p in sorted(output_dir.rglob("*")) if p.is_file()]
        return report


    if __name__ == "__main__":
        parser = argparse.ArgumentParser(description=__doc__)
        parser.add_argument("inventory_dir", type=Path)
        parser.add_argument("output_dir", type=Path)
        parser.add_argument("workload", type=Path)
        args = parser.parse_args()
        try:
            result = collect_smoke(args.inventory_dir, args.output_dir, args.workload)
        except Exception as error:
            result = {"status": "error", "error": f"{type(error).__name__}: {error}"}
        args.output_dir.mkdir(parents=True, exist_ok=True)
        (args.output_dir / "summary.json").write_text(json.dumps(result, indent=2) + "\n")
        print("KDA_ROCPROF_SMOKE_BEGIN", flush=True)
        print(json.dumps(result, indent=2), flush=True)
        print("KDA_ROCPROF_SMOKE_END", flush=True)
