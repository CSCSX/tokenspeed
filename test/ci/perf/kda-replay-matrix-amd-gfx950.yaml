    """Run one diagnostic replay with the existing KDA benchmark fixture."""

    import argparse
    import hashlib
    import json
    from pathlib import Path


    def main():
        parser = argparse.ArgumentParser(description=__doc__)
        parser.add_argument("--batch", type=int, choices=(16, 128), required=True)
        parser.add_argument(
            "--page-relation", choices=("distinct", "in-place"), required=True
        )
        args = parser.parse_args()

        import torch
        from amd.ops.attention.test_gluon_kda_replay_matrix import ReplayCase
        from tokenspeed_kernel.benchmark.graph import (
            GraphBenchmarkConfig,
            GraphTimer,
            PreparedInvocation,
        )
        from tokenspeed_kernel.platform import current_platform
        from tokenspeed_kernel_amd.ops.gfx950.attention.kda import decode

        if torch.version.hip is None or not torch.cuda.is_available():
            raise RuntimeError("This diagnostic requires a ROCm GPU")
        if not current_platform().is_cdna4:
            raise RuntimeError("This diagnostic requires gfx950")

        layers = 69
        seed = 7100
        eager_warmups = 5
        replay_warmups = 3
        measured_replays = 1
        case = ReplayCase(
            args.batch,
            1,
            layers,
            in_place=args.page_relation == "in-place",
            seed=seed,
        )
        timer = GraphTimer(
            GraphBenchmarkConfig(
                eager_warmup_iterations=eager_warmups,
                replay_warmup_iterations=replay_warmups,
            )
        )
        timer.measure(
            PreparedInvocation(invoke=case.lifecycle, reset=case.reset),
            cold_cache=True,
            measurement_blocks=measured_replays,
        )
        torch.cuda.synchronize()

        # Construction verifies each layer once. Capture execution must be checked
        # in the actual trace before any of these iteration positions are trusted.
        lifecycle_calls = eager_warmups + 1 + replay_warmups + measured_replays
        metadata = {
            "scope": "diagnostic only; no performance acceptance from profiled timing",
            "batch": args.batch,
            "window_length": 1,
            "layers": layers,
            "seed": seed,
            "page_relation": args.page_relation,
            "accepted_count": 1,
            "cache": "cold",
            "eager_warmups": eager_warmups,
            "replay_warmups": replay_warmups,
            "measured_replays": measured_replays,
            "source_sha256": hashlib.sha256(Path(decode.__file__).read_bytes()).hexdigest(),
            "trace_hypothesis": {
                "assumptions": "one kernel ID per family and no GPU execution during capture",
                "verify_count": (1 + lifecycle_calls) * layers,
                "recovery_count": lifecycle_calls,
                "measured_verify_first": lifecycle_calls * layers + 1,
                "measured_verify_last": (1 + lifecycle_calls) * layers,
                "measured_recovery": lifecycle_calls,
            },
        }
        print("KDA_PROFILE_WORKLOAD=" + json.dumps(metadata), flush=True)


    if __name__ == "__main__":
        main()
    KDA_COUNTER_WORKLOAD
      python3 - .ci-artifacts/published/rocprof-capabilities "$smoke_output" \
        "$smoke_output/workload.py" <<'KDA_COUNTER_SMOKE'
    # Copyright (c) 2026 LightSeek Foundation
