api_version: ci.tokenspeed.io/v1
name: ut-tokenspeed-kernel
type: ut
workflow_stage: unit-test
triggers:
  - per-commit
  - manual
runner:
  labels:
    - amd-mi355-1gpu
env:
  CI: "true"
install:
  - bash test/ci_system/install_deps.sh
ut:
  commands:
    - python3 -m pytest tokenspeed-kernel/test/test_numerics.py -v
    - python3 -m pytest tokenspeed-kernel/test/nvidia/thirdparty/test_trtllm_comm.py -v
    - python3 -m pytest tokenspeed-kernel/test/nvidia/thirdparty/test_cuda.py -v
    - python3 -m pytest tokenspeed-kernel/test/ -v --ignore=tokenspeed-kernel/test/ops --ignore=tokenspeed-kernel/test/test_numerics.py --ignore=tokenspeed-kernel/test/nvidia/thirdparty/test_trtllm_comm.py --ignore=tokenspeed-kernel/test/nvidia/thirdparty/test_cuda.py
    - python3 -m pytest tokenspeed-kernel/test/ops/ -v
    # Exercise the shared target-decode/MTP lifecycle with AMD kernel selection.
    - python3 -m pytest test/runtime/test_kimi_k3_kda_eager_commit.py -v
report:
  github_step_summary: true
