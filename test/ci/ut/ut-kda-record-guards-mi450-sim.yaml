api_version: ci.tokenspeed.io/v1
name: ut-kda-record-guards-mi450-sim
type: ut
workflow_stage: unit-test
triggers:
- manual
runner:
  labels:
  - amd-mi45x-cpu-test
env:
  BUILD_AND_DOWNLOAD_PARALLEL: '4'
  CI: 'true'
  GFX_ARCH: gfx1250
  MI450_SIM_THREADS_PER_WORKER: "2"
  ROCM_NIGHTLY_INDEX: https://nightly.repo.amd.com/rocm/whl-next/
  ROCM_SDK_VERSION: 10.2.0a20261010
  ROCM_SYSTEMS_REF: d5c528019d0fcfbbc32d96b53ac2c61df6d0e67d
  TORCH_DEVICE_PACKAGE: amd-torch-device-gfx1250==2.14.0+rocm10.2.0a20261010
  TORCH_INDEX_URL: https://nightly.repo.amd.com/rocm/whl-next/
  TORCH_VERSION: 2.14.0+rocm10.2.0a20261010
  TORCHVISION_VERSION: 0.29.0+rocm10.2.0a20261010
  PYTHONPATH: tokenspeed-kernel/test:tokenspeed-kernel/python:tokenspeed-kernel-amd/python
install:
- bash test/ci_system/setup_mi450_sim.sh
- WORKSPACE="$(pwd)" bash test/ci_system/install_deps_rocm.sh
ut:
  commands:
    - |
      # Emulator validation; assert text is from the compiled device-print payload.
      # The controller stays outside the emulator and starts one daemon per case.
      python3 -m amd.ops.attention.test_gluon_kda_record_guards \
        --mode suite --arch gfx1250 \
        --output .ci-artifacts/published/kda-record-guards \
        --launch-prefix taskset -c "$(python3 -c 'import os; print(",".join(map(str, sorted(os.sched_getaffinity(0))[:2])))')" \
        bash test/ci_system/run_mi450_rocjitsu.sh
report:
  github_step_summary: true
